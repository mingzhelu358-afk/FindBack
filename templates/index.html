<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FindBack 查询助手</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #07111f;
      --panel: rgba(18, 32, 50, .86);
      --line: rgba(148, 163, 184, .18);
      --text: #edf6ff;
      --muted: #9fb0c4;
      --cyan: #35d9ff;
      --green: #57e6a5;
      --danger: #ff8c9a;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Segoe UI", "Microsoft YaHei", sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at 18% 4%, rgba(27, 164, 215, .2), transparent 34rem),
        radial-gradient(circle at 88% 32%, rgba(44, 198, 140, .12), transparent 32rem),
        var(--bg);
    }
    .shell { width: min(980px, calc(100% - 32px)); margin: 0 auto; padding: 48px 0 70px; }
    header { margin-bottom: 28px; }
    .eyebrow { color: var(--cyan); font-weight: 700; letter-spacing: .12em; font-size: 13px; }
    h1 { margin: 8px 0 8px; font-size: clamp(34px, 6vw, 58px); line-height: 1.03; }
    .sub { color: var(--muted); margin: 0; font-size: 16px; }
    .panel {
      border: 1px solid var(--line);
      border-radius: 24px;
      background: var(--panel);
      box-shadow: 0 24px 80px rgba(0, 0, 0, .27);
      backdrop-filter: blur(20px);
    }
    .ask { padding: 20px; }
    .search-row { display: grid; grid-template-columns: 1fr auto auto; gap: 10px; }
    input {
      width: 100%; border: 1px solid var(--line); border-radius: 15px;
      background: rgba(3, 10, 20, .6); color: var(--text); padding: 15px 17px;
      font-size: 17px; outline: none;
    }
    input:focus { border-color: var(--cyan); box-shadow: 0 0 0 3px rgba(53, 217, 255, .12); }
    button {
      border: 0; border-radius: 15px; padding: 0 18px; min-height: 52px;
      color: #04111a; background: var(--cyan); font-weight: 800; font-size: 15px;
      cursor: pointer; transition: transform .16s ease, opacity .16s ease;
    }
    button:hover { transform: translateY(-1px); }
    button:disabled { opacity: .5; cursor: wait; transform: none; }
    .mic { width: 54px; padding: 0; font-size: 21px; background: #dff9ff; }
    .mic.listening { background: var(--danger); animation: pulse 1s infinite; }
    @keyframes pulse { 50% { box-shadow: 0 0 0 8px rgba(255, 140, 154, .15); } }
    .controls { display: flex; flex-wrap: wrap; gap: 9px; margin-top: 14px; align-items: center; }
    .chip { min-height: 36px; padding: 0 13px; color: var(--text); background: rgba(148,163,184,.12); font-weight: 600; }
    .auto-speak { margin-left: auto; color: var(--muted); font-size: 14px; display: flex; align-items: center; gap: 8px; }
    .auto-speak input { width: 17px; height: 17px; accent-color: var(--cyan); }
    .answer { display: none; margin-top: 18px; overflow: hidden; }
    .answer.show { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(250px, .75fr); }
    .answer-copy { padding: 28px; }
    .status { color: var(--green); font-size: 13px; font-weight: 800; letter-spacing: .09em; }
    .answer h2 { margin: 10px 0 12px; font-size: clamp(24px, 4vw, 38px); line-height: 1.22; }
    .meta { color: var(--muted); line-height: 1.8; }
    .speak-again { margin-top: 20px; background: var(--green); }
    .snapshot { min-height: 260px; background: rgba(0,0,0,.28); display: grid; place-items: center; }
    .snapshot img { width: 100%; height: 100%; min-height: 260px; object-fit: cover; }
    .placeholder { color: var(--muted); padding: 28px; text-align: center; }
    .section-title { display: flex; justify-content: space-between; align-items: end; margin: 30px 2px 12px; }
    .section-title h3 { margin: 0; font-size: 20px; }
    .section-title span { color: var(--muted); font-size: 13px; }
    .recent { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
    .recent-card { padding: 17px 18px; display: flex; justify-content: space-between; gap: 14px; align-items: center; }
    .recent-card strong { display: block; margin-bottom: 6px; }
    .recent-card small { color: var(--muted); }
    .recent-card button { min-height: 38px; padding: 0 13px; }
    .empty { padding: 24px; color: var(--muted); grid-column: 1 / -1; }
    .tip { color: var(--muted); text-align: center; margin: 18px 0 0; font-size: 13px; }
    @media (max-width: 700px) {
      .shell { padding-top: 28px; }
      .search-row { grid-template-columns: 1fr auto; }
      .search-row input { grid-column: 1 / -1; }
      .search-row .query { grid-column: 1; }
      .answer.show { grid-template-columns: 1fr; }
      .recent { grid-template-columns: 1fr; }
      .auto-speak { width: 100%; margin-left: 0; }
    }
  </style>
</head>
<body>
  <main class="shell">
    <header>
      <div class="eyebrow">FINDBACK · 本地物品记忆</div>
      <h1>你在找什么？</h1>
      <p class="sub">输入或说出“我的杯子在哪里”，我会回答最后位置，并说明它是否可能被电脑遮挡。</p>
    </header>

    <section class="panel ask">
      <div class="search-row">
        <input id="question" autocomplete="off" value="我的杯子在哪里" aria-label="输入要寻找的物品">
        <button class="query" id="queryButton">查询位置</button>
        <button class="mic" id="micButton" title="使用麦克风提问" aria-label="使用麦克风提问">🎙</button>
      </div>
      <div class="controls" id="chips"></div>
      <label class="auto-speak"><input id="autoSpeak" type="checkbox" checked> 查询后自动语音播报</label>
    </section>

    <section class="panel answer" id="answerPanel" aria-live="polite">
      <div class="answer-copy">
        <div class="status" id="status">查询结果</div>
        <h2 id="answerText"></h2>
        <div class="meta" id="answerMeta"></div>
        <button class="speak-again" id="speakButton">🔊 再播报一次</button>
      </div>
      <div class="snapshot" id="snapshot"><div class="placeholder">识别快照会显示在这里</div></div>
    </section>

    <div class="section-title"><h3>最近看到的物品</h3><span>自动读取最新记录</span></div>
    <section class="recent" id="recent"><div class="panel empty">正在读取数据库……</div></section>
    <p class="tip">本页面只在你的电脑本地运行。请让 run_findback.py 保持运行，以持续更新物品位置。</p>
  </main>

  <script>
    const labels = ["钥匙", "钱包", "眼镜", "手机", "背包", "杯子", "书", "瓶子", "电脑"];
    const question = document.querySelector("#question");
    const queryButton = document.querySelector("#queryButton");
    const micButton = document.querySelector("#micButton");
    const autoSpeak = document.querySelector("#autoSpeak");
    const answerPanel = document.querySelector("#answerPanel");
    const answerText = document.querySelector("#answerText");
    const answerMeta = document.querySelector("#answerMeta");
    const status = document.querySelector("#status");
    const snapshot = document.querySelector("#snapshot");
    const recent = document.querySelector("#recent");
    let lastAnswer = "";

    document.querySelector("#chips").innerHTML = labels.map(label =>
      `<button class="chip" data-label="${label}">${label}</button>`
    ).join("");

    document.querySelectorAll(".chip").forEach(button => {
      button.addEventListener("click", () => {
        question.value = `我的${button.dataset.label}在哪里`;
        runQuery();
      });
    });

    function speak(text) {
      if (!("speechSynthesis" in window)) return;
      window.speechSynthesis.cancel();
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = "zh-CN";
      utterance.rate = 0.95;
      const voices = window.speechSynthesis.getVoices();
      const chineseVoice = voices.find(v => v.lang.toLowerCase().startsWith("zh"));
      if (chineseVoice) utterance.voice = chineseVoice;
      window.speechSynthesis.speak(utterance);
    }

    function formatTime(value) {
      if (!value) return "";
      const date = new Date(value);
      if (Number.isNaN(date.getTime())) return value.replace("T", " ");
      return date.toLocaleString("zh-CN", { hour12: false });
    }

    async function runQuery() {
      const text = question.value.trim();
      if (!text) return;
      queryButton.disabled = true;
      queryButton.textContent = "查询中…";
      try {
        const response = await fetch(`/api/query?q=${encodeURIComponent(text)}`);
        const data = await response.json();
        if (!response.ok) throw new Error(data.detail || "查询失败");

        lastAnswer = data.answer;
        answerText.textContent = data.answer;
        status.textContent = data.found ? "已找到最后记录" : "暂时没有结果";
        status.style.color = data.found ? "var(--green)" : "var(--danger)";
        if (data.found) {
          let metadata = `识别时间：${formatTime(data.detected_at)}<br>物品识别置信度：${Math.round(data.confidence * 100)}%`;
          if (data.relation) {
            metadata += `<br>空间关系：可能在${data.relation.reference_label}后面`;
            metadata += `<br>关系置信度：${Math.round(data.relation.confidence * 100)}%`;
            metadata += `<br>判断依据：${data.relation.evidence}`;
          }
          answerMeta.innerHTML = metadata;
        } else {
          answerMeta.textContent = "让识别程序继续运行，产生记录后再来查询。";
        }
        snapshot.innerHTML = data.snapshot_url
          ? `<img src="${data.snapshot_url}?t=${Date.now()}" alt="${data.object_label || "物品"}最后出现时的快照">`
          : '<div class="placeholder">这条结果没有保存快照</div>';
        answerPanel.classList.add("show");
        if (autoSpeak.checked) speak(lastAnswer);
      } catch (error) {
        lastAnswer = `查询失败：${error.message}`;
        answerText.textContent = lastAnswer;
        answerMeta.textContent = "请确认查询服务和数据库都能正常访问。";
        status.textContent = "发生错误";
        status.style.color = "var(--danger)";
        snapshot.innerHTML = '<div class="placeholder">没有可显示的快照</div>';
        answerPanel.classList.add("show");
      } finally {
        queryButton.disabled = false;
        queryButton.textContent = "查询位置";
      }
    }

    async function loadRecent() {
      try {
        const response = await fetch("/api/recent");
        const data = await response.json();
        if (!response.ok) throw new Error(data.detail || "读取失败");
        if (!data.items.length) {
          recent.innerHTML = '<div class="panel empty">数据库中还没有识别记录。先运行 run_findback.py 并让摄像头看到一个物品。</div>';
          return;
        }
        recent.innerHTML = data.items.map(item => `
          <article class="panel recent-card">
            <div><strong>${item.object_label} · ${item.location}</strong><small>${formatTime(item.detected_at)}</small></div>
            <button data-object="${item.object_label}">询问</button>
          </article>`).join("");
        recent.querySelectorAll("button").forEach(button => {
          button.addEventListener("click", () => {
            question.value = `我的${button.dataset.object}在哪里`;
            runQuery();
          });
        });
      } catch (error) {
        recent.innerHTML = `<div class="panel empty">无法读取最近记录：${error.message}</div>`;
      }
    }

    queryButton.addEventListener("click", runQuery);
    question.addEventListener("keydown", event => {
      if (event.key === "Enter") runQuery();
    });
    document.querySelector("#speakButton").addEventListener("click", () => speak(lastAnswer));

    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (SpeechRecognition) {
      const recognition = new SpeechRecognition();
      recognition.lang = "zh-CN";
      recognition.interimResults = false;
      recognition.continuous = false;
      recognition.onstart = () => {
        micButton.classList.add("listening");
        micButton.textContent = "●";
        question.placeholder = "正在听，请说出要找的物品……";
      };
      recognition.onresult = event => {
        question.value = event.results[0][0].transcript;
        runQuery();
      };
      recognition.onerror = event => {
        answerText.textContent = event.error === "not-allowed"
          ? "浏览器没有获得麦克风权限。请允许此网站使用麦克风。"
          : `没有听清楚，请再试一次（${event.error}）。`;
        answerMeta.textContent = "你也可以直接在输入框中打字。";
        status.textContent = "语音输入未完成";
        status.style.color = "var(--danger)";
        snapshot.innerHTML = '<div class="placeholder">等待查询</div>';
        answerPanel.classList.add("show");
      };
      recognition.onend = () => {
        micButton.classList.remove("listening");
        micButton.textContent = "🎙";
        question.placeholder = "例如：我的杯子在哪里";
      };
      micButton.addEventListener("click", () => recognition.start());
    } else {
      micButton.disabled = true;
      micButton.title = "当前浏览器不支持语音输入，请使用 Edge 或 Chrome";
    }

    loadRecent();
    setInterval(loadRecent, 15000);
  </script>
</body>
</html>
